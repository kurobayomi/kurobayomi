[package]
name = "kuro-extensions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# On by default so the app loads each verified component through the WASM host (T-20a-001). It links wasmtime through
# kuro-source-wasm; build with `--no-default-features` to leave it out.
default = ["wasm"]
wasm = ["dep:kuro-source-wasm"]

[dependencies]
async-channel = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
ed25519-dalek = "3.0.0"
flate2 = { workspace = true }
futures = { workspace = true }
kuro-core = { path = "../kuro-core" }
kuro-i18n = { path = "../kuro-i18n" }
kuro-net = { workspace = true }
kuro-platform = { path = "../kuro-platform" }
kuro-prefs = { path = "../kuro-prefs" }
kuro-source = { path = "../kuro-source" }
kuro-source-wasm = { path = "../kuro-source-wasm", optional = true }
prost = { version = "0.14.4", default-features = false, features = ["derive"] }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
toml_edit = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
kuro-db = { path = "../kuro-db" }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["net"] }
tracing-subscriber = { workspace = true }
wiremock = { workspace = true }
