[package]
name = "kuro-images"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["avif", "jxl"]
# AVIF stills through the image crate's dav1d backend. avif-decode needs `nasm` to build rav1d on
# x86_64, and the workspace already links dav1d through kuro-core's image dependency. Without the feature an AVIF
# file is `UnsupportedFormat`.
avif = ["image/avif-native"]
# JPEG XL stills through jxl-oxide. Without it a JXL file is `UnsupportedFormat`.
jxl = ["dep:jxl-oxide"]
# Display ICC profile through lcms2 (system liblcms2). Off by default (T-34a-031, design section 9).
icc = ["dep:lcms2"]
# HEIF and HEIC stills through the system libheif. Off by default: it needs the `libheif` package to
# build and run. Without the feature a HEIF file is `DecodeInit` ("Failed to initialize decoder").
heif = ["dep:libheif-rs"]

[dependencies]
bytes.workspace = true
chrono.workspace = true
http.workspace = true
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }
jxl-oxide = { version = "0.11", features = ["image"], optional = true }
lcms2 = { version = "6.2.0", optional = true }
libheif-rs = { version = "3.0.0", optional = true, default-features = false, features = ["v1_17"] }
kuro-core = { path = "../kuro-core" }
kuro-i18n = { path = "../kuro-i18n" }
kuro-net = { path = "../kuro-net" }
kuro-platform = { path = "../kuro-platform" }
md-5.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
url.workspace = true

[dev-dependencies]
kuro-prefs = { path = "../kuro-prefs" }
tempfile.workspace = true
wiremock.workspace = true
