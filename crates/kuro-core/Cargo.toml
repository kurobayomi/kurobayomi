[package]
name = "kuro-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# libarchive binding for non-zip archives (T-13a-031).
archive = []
# AVIF and HEIF decoding. HEIF has no decoder yet; see image/mod.rs.
heif = []
# TorrServer client and supervisor (T-13a-040, T-13a-041).
torrent = ["dep:reqwest"]
# Built-in updater (T-54a-003). Off until the updater lands.
updater = []

[dependencies]
image.workspace = true
tokio = { workspace = true, features = ["process"] }
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
md-5 = { workspace = true }
sha1 = "0.11.0"
sha2 = { workspace = true }
thiserror = { workspace = true }
kuro-platform = { path = "../kuro-platform" }
kuro-prefs = { path = "../kuro-prefs" }
async-trait = { workspace = true }
icu_collator = "2"
icu_locale = "2"
jxl-oxide = { version = "0.11", features = ["image"] }
serde = { workspace = true }
serde_json = { workspace = true }
quick-xml = "0.42.0"
reqwest = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
proptest = { workspace = true }
wiremock = { workspace = true }

[[test]]
name = "crash_main_thread"
path = "tests/crash_main_thread.rs"
harness = false
