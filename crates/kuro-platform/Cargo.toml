[package]
name = "kuro-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# each platform feature takes effect only when building for its OS
default = ["platform-linux", "platform-windows"]
platform-linux = ["keyring"]
platform-windows = ["keyring"]
platform-macos = []

[dependencies]
async-channel = { workspace = true }
async-trait = { workspace = true }
chacha20poly1305 = "0.10.1"
directories = { workspace = true }
# the system keyring: the Secret Service on Linux, the Credential Manager on Windows
keyring = { workspace = true, optional = true }
libc = "0.2.189"
regex = { workspace = true }
serde = { workspace = true }
serde_json = "1.0.151"
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time", "net", "io-util"] }
tokio-util = { workspace = true }
url = "2"

[target.'cfg(target_os = "linux")'.dependencies]
futures-util = "0.3.34"
gio = "0.22.10"
rustix = { version = "1", features = ["fs"] }
souvlaki = { version = "0.8.3", default-features = false, features = ["use_zbus"] }
zbus = "5.13.2"
webkit6 = "0.6"
# webkit6 needs GTK's 4.10+ API switched on; the app does that too (v4_14), this keeps the crate building on its own
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_14"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_OpenGL", "Win32_Storage_FileSystem", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros", "rt", "time", "net", "io-util"] }
tempfile = { workspace = true }
