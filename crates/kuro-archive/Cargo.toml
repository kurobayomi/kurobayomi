[package]
name = "kuro-archive"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints.rust]
# The libarchive binding in src/libarchive.rs and the mapping in src/reader.rs carry `unsafe`
# blocks, each with a SAFETY note. No other module may use `unsafe`.
unsafe_code = "deny"

[dependencies]
kuro-core = { path = "../kuro-core" }
chrono.workspace = true
memmap2 = "0.9.11"
scraper.workspace = true
thiserror.workspace = true
tracing.workspace = true
# Stored (uncompressed) CBZ writing only; deflate reading is not used here.
zip = { version = "8.6.0", default-features = false, features = ["deflate", "chrono"] }

[dev-dependencies]
tempfile.workspace = true
