[package]
name = "kurobayomi"
version = "0.2.5"
edition = "2024"

[features]
# the built-in updater; off by default (it sets `updater_enabled` in `app_info`)
updater = ["kuro-core/updater"]

[dependencies]
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_14"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
kuro-core = { path = "crates/kuro-core" }
kuro-archive = { path = "crates/kuro-archive" }
kuro-data = { path = "crates/kuro-data" }
kuro-downloads = { path = "crates/kuro-downloads" }
kuro-db = { path = "crates/kuro-db" }
kuro-domain = { path = "crates/kuro-domain" }
kuro-i18n = { path = "crates/kuro-i18n" }
kuro-platform = { path = "crates/kuro-platform" }
kuro-prefs = { path = "crates/kuro-prefs" }
kuro-source = { path = "crates/kuro-source" }
kuro-source-scrape = { path = "crates/kuro-source-scrape" }
kuro-extensions = { path = "crates/kuro-extensions" }
kuro-backup = { path = "crates/kuro-backup" }
kuro-local = { path = "crates/kuro-local" }
kuro-images = { path = "crates/kuro-images" }
kuro-player = { path = "crates/kuro-player" }
kuro-track = { path = "crates/kuro-track" }
kuro-net = { workspace = true }
http = { workspace = true }
reqwest = { workspace = true, features = ["blocking"] }
async-channel = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
image = { workspace = true }
rusqlite = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
sha2 = { workspace = true }
fancy-regex = "0.19.2"
regex = { workspace = true }
argon2 = "0.6.0"
tracing = { workspace = true }
toml_edit = { workspace = true }
url = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
kuro-testkit = { path = "crates/kuro-testkit" }
proptest = "1.11.0"

[workspace]
members =["crates/kuro-core", "crates/kuro-i18n", "crates/kuro-platform", "crates/kuro-testkit", "crates/kuro-prefs", "crates/kuro-db", "crates/kuro-data", "crates/kuro-domain", "crates/kuro-source", "crates/kuro-source-http", "crates/kuro-source-scrape", "crates/kuro-net", "crates/kuro-extensions", "crates/kuro-player", "crates/kuro-source-wasm", "crates/kuro-downloads", "crates/kuro-images", "crates/kuro-local", "crates/kuro-archive", "crates/kuro-track", "crates/kuro-backup"]
resolver = "3"

[workspace.package]
version = "0.2.5"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"

[workspace.dependencies]
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-appender = "0.2.5"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
directories = "6.0.0"
keyring = "4.2.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp", "avif-native"] }
md-5 = "0.11.0"
sha2 = "0.11.0"
tempfile = "3.27.0"
thiserror = "2.0.21"
serde = { version = "1.0.229", features = ["derive"] }
toml_edit = { version = "0.25.16", features = ["serde"] }
rusqlite = { version = "0.40.2", features = ["bundled", "functions"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
regex = "1.13.1"
rand = { version = "0.10.3", features = ["chacha"] }
proptest = "1.7.0"
icu_collator = "2.3.1"
icu_locale = "2.3.1"
url = "2.5.8"
encoding_rs = "0.8.42"
scraper = "0.27.0"
flate2 = "1.1.10"
base64 = "0.23.1"
wiremock = "0.6.5"
kuro-domain = { path = "crates/kuro-domain" }
kuro-net = { path = "crates/kuro-net" }
kuro-platform = { path = "crates/kuro-platform" }
kuro-prefs = { path = "crates/kuro-prefs" }
kuro-source = { path = "crates/kuro-source" }
kuro-source-http = { path = "crates/kuro-source-http" }
kuro-extensions = { path = "crates/kuro-extensions" }
async-trait = "0.1.92"
async-channel = "2.5.0"
futures = "0.3.34"
tokio-util = "0.7.19"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "json", "stream", "gzip", "brotli", "zstd", "cookies", "form", "query", "hickory-dns"] }
cookie_store = "0.22.1"
cookie = "0.18.2"
reqwest_cookie_store = "0.10.0"
psl = "2.1.241"
http = "1"
bytes = "1"
serde_json = "1.0.151"
prost = { version = "0.14.4", default-features = false, features = ["derive"] }

[profile.release]
# thin LTO, one codegen unit, file and line numbers in backtraces, nothing stripped, panics unwind (crash reports)
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
panic = "unwind"

# pre-release builds: the release settings under their own name, which `app_info` reports as the build type
[profile.preview]
inherits = "release"

[profile.dist]
inherits = "release"
lto = "fat"

[profile.dev]
# keep target/ small: no incremental cache, line tables only
incremental = false
debug = "line-tables-only"

# Compiling a plug-in with an unoptimised Cranelift takes minutes; optimised, seconds. Only the compiler crates, so the
# rest of a debug build stays fast to build.
[profile.dev.package.cranelift-codegen]
opt-level = 3
[profile.dev.package.cranelift-frontend]
opt-level = 3
[profile.dev.package.cranelift-entity]
opt-level = 3
[profile.dev.package.cranelift-bforest]
opt-level = 3
[profile.dev.package.cranelift-control]
opt-level = 3
[profile.dev.package.regalloc2]
opt-level = 3
[profile.dev.package.wasmparser]
opt-level = 3
[profile.dev.package.wasmtime-environ]
opt-level = 3
[profile.dev.package.wasmtime-internal-cranelift]
opt-level = 3
[profile.dev.package.wasmtime]
opt-level = 3
[profile.dev.package.object]
opt-level = 3
[profile.dev.package.gimli]
opt-level = 3
