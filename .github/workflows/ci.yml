name: CI

# Runs only when something that is compiled or checked changes; README, docs, plans and other text do not start a run.
on:
  push:
    paths:
      - 'crates/**'
      - 'src/**'
      - 'tests/**'
      - 'assets/**'
      - 'spec/**'
      - 'build.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/**'
      - 'ci/**'
      - '.github/workflows/ci.yml'
  # a manual run, so a commit that no push run covers (a docs-only commit under a release tag) can still get its CI result
  workflow_dispatch:
  pull_request:
    paths:
      - 'crates/**'
      - 'src/**'
      - 'tests/**'
      - 'assets/**'
      - 'spec/**'
      - 'build.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/**'
      - 'ci/**'
      - '.github/workflows/ci.yml'

permissions:
  contents: read
  # to pull the build image
  packages: read

# bash, as on the plain runners: in a container a step's default shell is sh
defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ubuntu-latest
    # Ubuntu 24.04 with every system package already in it (ci/Dockerfile, built by build-image.yml): nothing is
    # installed from Ubuntu's mirror here, which once held a run for over an hour
    container:
      image: ghcr.io/${{ github.repository_owner }}/kurobayomi-build:noble
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - name: Update Rust
        run: rustup update stable

      # Keeps the compiled dependencies between runs: without it every run builds the whole workspace from scratch,
      # which was about 9 of the 10 minutes of the Tests step.
      - name: Cache the build
        uses: Swatinem/rust-cache@v2

      - name: Platform boundary check
        run: scripts/check-platform-boundary.sh

      - name: Literal path check
        run: scripts/check-path-literals.sh

      - name: Tests
        # The default debug build of this workspace fills the runner disk, so build without debug symbols or incremental data.
        env:
          CARGO_INCREMENTAL: "0"
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: cargo test --workspace

      - name: Disk space left
        if: always()
        run: df -h / | cat

  # The Windows port (plans/addenda/requirements-cross-platform.md, rule 7): the whole app built and tested on Windows
  # with the MSYS2 UCRT64 toolchain whose GTK, mpv, dav1d and libarchive the installer bundles. Tests that need a Unix
  # shell, Unix file modes or Linux desktop tools are #[cfg(unix)].
  windows:
    runs-on: windows-latest
    # a GTK test that waits for a window event that never comes would otherwise hold the runner for 6 hours
    timeout-minutes: 60
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5

      # MSYS2's own Rust (not rustup), so the compiler, the linker and the libraries all come from UCRT64
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          # git: kuro-core's build script reads the commit for `--version`
          install: git
          pacboy: >-
            toolchain:p rust:p pkgconf:p cmake:p nasm:p
            gtk4:p mpv:p dav1d:p libarchive:p

      # the build folder between runs; saved after a failed run too, since test failures leave a good build behind
      - name: Cache the build
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Tests
        # as on Linux: no debug symbols or incremental data, which would fill the runner disk
        env:
          CARGO_INCREMENTAL: "0"
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: cargo test --locked --workspace --no-fail-fast
