name: Release

# Pushing a tag like v0.1.0 builds the stable AppImage and the Windows installer and publishes them as a normal release
# (GitHub shows it as "Latest"). Nothing is published for a manual run: it builds the same files from the branch you pick
# and offers them as downloads of the run, to test this pipeline without a tag. How to cut a release: docs/RELEASING.md.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read
  # to pull the build image
  packages: read

# bash, as on the plain runners: in a container a step's default shell is sh (the publish step uses bash arrays)
defaults:
  run:
    shell: bash

jobs:
  release:
    # Same machine as the nightly: the AppImage bundles its libraries, so it runs on glibc 2.39 and newer (Ubuntu 24.04+).
    # The build image (ci/Dockerfile, built by build-image.yml) is that Ubuntu with every system package already in it:
    # nothing is installed from Ubuntu's mirror, which once held a release run for 73 minutes.
    # Way back if the image ever breaks a release: delete this `container:` block and uncomment the two apt steps below.
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/${{ github.repository_owner }}/kurobayomi-build:noble
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Read the version
        run: |
          version="$(grep -m1 '^version = ' Cargo.toml | sed -E 's/^version = "(.*)"$/\1/')"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Check the tag (tag runs only)
        if: github.ref_type == 'tag'
        run: |
          # the tag must name the version in Cargo.toml, sit on main, and the commit must have passed CI
          [ "$GITHUB_REF_NAME" = "v$VERSION" ] || { echo "the tag $GITHUB_REF_NAME does not match version $VERSION in Cargo.toml" >&2; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "the tag is not on main" >&2; exit 1; }
          passed="$(gh run list --workflow CI --commit "$GITHUB_SHA" --json conclusion --jq '[.[] | select(.conclusion == "success")] | length')"
          [ "$passed" -ge 1 ] || { echo "no successful CI run for $GITHUB_SHA: run the CI workflow on it first (it can be started by hand)" >&2; exit 1; }
          scripts/release-notes.sh "$VERSION" > release-notes.md

      - name: Keep the release notes (tag runs only)
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md
          retention-days: 1

      # The way back (see `container:` above): the packages installed on the plain runner, as before the build image.
      # - name: Cache the downloaded packages
      #   uses: actions/cache@v4
      #   with:
      #     path: ~/apt-archives/*.deb
      #     key: apt-release-${{ hashFiles('.github/workflows/release.yml') }}
      #     restore-keys: apt-release-
      #
      # - name: Install system packages
      #   run: |
      #     mkdir -p ~/apt-archives/partial
      #     sudo apt-get update
      #     sudo apt-get install -y -o Dir::Cache::Archives="$HOME/apt-archives" build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev libdav1d-dev libmpv-dev patchelf glib-networking dconf-gsettings-backend desktop-file-utils file zsync \
      #       nasm libgnutls28-dev libxml2-dev libva-dev libvdpau-dev libdrm-dev zlib1g-dev libbz2-dev

      - name: Update Rust
        run: rustup update stable

      - name: Cache the build
        uses: Swatinem/rust-cache@v2
        with:
          # restore only: a cache saved under a tag can be used by no later run (each tag is its own scope), so saving
          # it just takes about 1 GB of the repository's 10 GB cache space
          save-if: false

      - name: Build
        # the stable build has no KB_CHANNEL (it is not a nightly); the release checker of the About page is on and reads
        # this repository's releases, wherever it lives
        env:
          KB_UPDATE_REPOSITORY: ${{ github.repository }}
        run: cargo build --release --locked --features updater

      # A decode-only FFmpeg replaces Ubuntu's in the AppImage (scripts/build-ffmpeg.sh says why); built once and kept
      # until the script changes
      - name: Cache the FFmpeg build
        id: ffmpeg
        uses: actions/cache@v4
        with:
          path: ~/ffmpeg
          # the nightly's key: same build image, same FFmpeg (on the plain runner it was ffmpeg-${{ runner.os }}-<hash>)
          key: ffmpeg-image-${{ hashFiles('scripts/build-ffmpeg.sh', 'ci/Dockerfile') }}

      - name: Build FFmpeg
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        run: scripts/build-ffmpeg.sh ~/ffmpeg

      - name: Pack the AppImage
        run: |
          FFMPEG_PREFIX=~/ffmpeg scripts/build-appimage.sh target/release/kurobayomi target/appimage/Kurobayomi-x86_64.AppImage
          cd target/appimage
          sha256sum Kurobayomi-x86_64.AppImage > SHA256SUMS
          cat SHA256SUMS

      # the binary's debug info, left out of the AppImage: with it addr2line turns a crash report's addresses into files
      # and lines
      - name: Keep the debug info
        uses: actions/upload-artifact@v4
        with:
          name: kurobayomi-${{ env.VERSION }}-debug
          path: target/appimage/*.debug

      - name: Offer the AppImage as a download (manual runs only)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v5
        with:
          name: Kurobayomi-${{ env.VERSION }}-test-build
          path: |
            target/appimage/Kurobayomi-x86_64.AppImage
            target/appimage/Kurobayomi-x86_64.AppImage.zsync
            target/appimage/SHA256SUMS
          retention-days: 7

      - name: Hand the AppImage to the publish job (tag runs only)
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: release-files-appimage
          path: |
            target/appimage/Kurobayomi-x86_64.AppImage
            target/appimage/Kurobayomi-x86_64.AppImage.zsync
          retention-days: 1

  # The Windows installer (dist/windows/kurobayomi.iss) of the same commit, built like the nightly's
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          # git: kuro-core's build script reads the commit for `--version`
          install: git
          pacboy: >-
            toolchain:p rust:p pkgconf:p cmake:p nasm:p ntldd:p
            gtk4:p mpv:p dav1d:p libarchive:p

      - name: Cache the build
        uses: Swatinem/rust-cache@v2
        with:
          # the nightly's Windows cache (same job name and key), read from main; a tag's own cache would serve no later run
          key: release
          save-if: false

      - name: Build
        # as the AppImage above: no KB_CHANNEL, the release checker on
        env:
          KB_UPDATE_REPOSITORY: ${{ github.repository }}
        run: cargo build --release --locked --features updater

      - name: Bundle
        run: scripts/bundle-windows.sh target/release/kurobayomi.exe Kurobayomi

      # every DLL loads: Windows' own folders only on PATH (see the nightly)
      - name: Start the bundled app
        shell: pwsh
        timeout-minutes: 2
        run: |
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $run = Start-Process -FilePath Kurobayomi\bin\kurobayomi.exe -ArgumentList '--version' -NoNewWindow -Wait -PassThru -RedirectStandardOutput version.txt
          Get-Content version.txt
          if ($run.ExitCode -ne 0) { throw "the bundled app exited with $($run.ExitCode)" }

      - name: Install Inno Setup
        shell: pwsh
        run: if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build the installer
        run: scripts/build-windows-installer.sh stable Kurobayomi installer

      - uses: actions/upload-artifact@v4
        with:
          # the publish job's on a tag run; the run's download on a manual one
          name: release-files-windows
          path: installer/Kurobayomi-Setup-x86_64.exe
          retention-days: 7

  publish:
    if: github.ref_type == 'tag'
    needs: [release, windows]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: files

      - name: Read the version
        run: |
          version="$(grep -m1 '^version = ' Cargo.toml | sed -E 's/^version = "(.*)"$/\1/')"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # one line per file, in sha256sum's format: the self-updaters read it when GitHub gives no digest
      - name: Sum the files
        run: |
          cd files
          sha256sum Kurobayomi-x86_64.AppImage Kurobayomi-Setup-x86_64.exe > SHA256SUMS
          cat SHA256SUMS

      - name: Publish the release
        run: |
          cd files
          {
            printf '\n---\n\nBuilt from commit %s.\n\n```\n' "$GITHUB_SHA"
            cat SHA256SUMS
            printf '```\n'
          } >> release-notes.md
          files=(Kurobayomi-x86_64.AppImage Kurobayomi-x86_64.AppImage.zsync Kurobayomi-Setup-x86_64.exe SHA256SUMS)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # a re-run of the same tag: replace the files and the notes
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
            gh release edit "$GITHUB_REF_NAME" --title "Kurobayomi $VERSION" --notes-file release-notes.md --latest
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" --verify-tag --title "Kurobayomi $VERSION" --notes-file release-notes.md --latest
          fi
