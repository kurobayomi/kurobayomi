name: Nightly

# Every push to main that passes the CI tests builds the AppImage and the Windows installer and updates the one release
# called "nightly" (a rolling prerelease: no version tags). The file names never change, so one fixed download address
# always serves the newest build (Shelly's StaticUrl update check watches the AppImage's); the commit hash is in the
# release title and notes. Stable builds are tagged releases and have their own workflow.
on:
  # runs after the CI workflow finished, and only when its tests passed
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# a running build finishes (a cancelled one never saves its build cache, so the next would compile everything again); a
# newer push waits, and replaces any older one still waiting, so the release still ends on the newest commit
concurrency:
  group: nightly-appimage
  cancel-in-progress: false

permissions:
  contents: write
  # to pull the build image
  packages: read

env:
  # the commit that passed CI, or the current one for a manual run
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

# bash, as on the plain runners: in a container a step's default shell is sh
defaults:
  run:
    shell: bash

jobs:
  appimage:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    # The AppImage bundles the build machine's libraries, so it runs on distros with glibc 2.39 or newer. The machine is
    # Ubuntu 24.04 (also the first with GTK 4.14, which the gtk4 v4_14 feature needs) with every system package already
    # in it (ci/Dockerfile, built by build-image.yml): nothing is installed from Ubuntu's mirror here.
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/${{ github.repository_owner }}/kurobayomi-build:noble
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SHA }}

      - name: Update Rust
        run: rustup update stable

      - name: Cache the build
        uses: Swatinem/rust-cache@v2
        with:
          # a later step failing (the release upload) must not throw away a finished build: the next run would compile
          # every dependency again
          cache-on-failure: true

      - name: Build
        # the commit and the channel are baked in: the self-updater compares them with the nightly release
        # and it skips the slow optimisations of the release profile (link-time optimisation, one codegen unit): a faster
        # build, a slightly slower app. Stable builds keep them. The profile stays "release", so the app still says Stable.
        env:
          KB_COMMIT: ${{ env.SHA }}
          KB_CHANNEL: nightly
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        run: cargo build --release --locked

      # A decode-only FFmpeg replaces Ubuntu's in the AppImage (scripts/build-ffmpeg.sh says why); built once and kept
      # until the script changes
      - name: Cache the FFmpeg build
        id: ffmpeg
        uses: actions/cache@v4
        with:
          path: ~/ffmpeg
          # "image": the build runs in the build image now, whose home folder differs, and FFmpeg's files name their prefix
          key: ffmpeg-image-${{ hashFiles('scripts/build-ffmpeg.sh', 'ci/Dockerfile') }}

      - name: Build FFmpeg
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        run: scripts/build-ffmpeg.sh ~/ffmpeg

      - name: Pack the AppImage
        env:
          CHANNEL: nightly
        run: |
          echo "APPIMAGE=target/appimage/Kurobayomi-nightly-x86_64.AppImage" >> "$GITHUB_ENV"
          FFMPEG_PREFIX=~/ffmpeg scripts/build-appimage.sh target/release/kurobayomi target/appimage/Kurobayomi-nightly-x86_64.AppImage

      # the binary's debug info, left out of the AppImage: with it addr2line turns a crash report's addresses into files
      # and lines
      - name: Keep the debug info
        uses: actions/upload-artifact@v4
        with:
          name: kurobayomi-nightly-debug-${{ env.SHA }}
          path: target/appimage/*.debug

      # the release is updated by the publish job, once the Windows installer is built too
      - uses: actions/upload-artifact@v4
        with:
          name: nightly-files-appimage
          path: |
            ${{ env.APPIMAGE }}
            ${{ env.APPIMAGE }}.zsync
          retention-days: 1

  # The Windows nightly: the app with every DLL and the GTK data it needs (scripts/bundle-windows.sh), packed as the
  # installer (dist/windows/kurobayomi.iss), installed and tried on the runner, then handed to the publish job.
  windows:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SHA }}

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          # git: kuro-core's build script reads the commit for `--version`
          install: git
          pacboy: >-
            toolchain:p rust:p pkgconf:p cmake:p nasm:p ntldd:p
            gtk4:p mpv:p dav1d:p libarchive:p

      - name: Cache the build
        uses: Swatinem/rust-cache@v2
        with:
          # its own cache: the CI job is also called "windows", and its debug test build would be restored here (a full
          # match, so this release build would never be saved)
          key: release
          cache-on-failure: true

      - name: Build
        # as the AppImage's build above: the nightly channel and commit baked in, the quick release profile
        env:
          KB_COMMIT: ${{ env.SHA }}
          KB_CHANNEL: nightly
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        run: cargo build --release --locked

      - name: Bundle
        run: scripts/bundle-windows.sh target/release/kurobayomi.exe Kurobayomi-Nightly

      # the bundled exe started with Windows' own folders on PATH only: Windows loads every DLL before main runs, so a
      # missing one fails here. It has no console of its own (a GUI program), so its output goes to a file.
      - name: Start the bundled app
        shell: pwsh
        timeout-minutes: 2
        run: |
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $run = Start-Process -FilePath Kurobayomi-Nightly\bin\kurobayomi.exe -ArgumentList '--version' -NoNewWindow -Wait -PassThru -RedirectStandardOutput version.txt
          Get-Content version.txt
          if ($run.ExitCode -ne 0) { throw "the bundled app exited with $($run.ExitCode)" }

      - name: Install Inno Setup
        shell: pwsh
        run: if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build the installer
        run: scripts/build-windows-installer.sh nightly Kurobayomi-Nightly installer

      # as a user would: the setup run silently (as the self-updater runs it), then the installed copy started
      - name: Install it
        shell: pwsh
        timeout-minutes: 5
        run: |
          $setup = Start-Process installer\Kurobayomi-Nightly-Setup-x86_64.exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "the setup exited with $($setup.ExitCode)" }
          $app = "$env:LOCALAPPDATA\Programs\Kurobayomi Nightly"
          foreach ($file in 'bin\kurobayomi.exe', 'bin\gdbus.exe', 'unins000.exe') {
            if (-not (Test-Path "$app\$file")) { throw "the setup did not install $file" }
          }
          $run = Start-Process "$app\bin\kurobayomi.exe" -ArgumentList '--version' -NoNewWindow -Wait -PassThru -RedirectStandardOutput installed.txt
          Get-Content installed.txt
          if ($run.ExitCode -ne 0) { throw "the installed app exited with $($run.ExitCode)" }

      # a second launch must hand its request (here a kurobayomi:// link) to the running app over GLib's session bus
      # (gdbus.exe) and quit. Reported, not required: a window on a CI desktop is not a user's desktop
      - name: Single instance
        shell: pwsh
        timeout-minutes: 3
        continue-on-error: true
        run: |
          $exe = "$env:LOCALAPPDATA\Programs\Kurobayomi Nightly\bin\kurobayomi.exe"
          $first = Start-Process $exe -PassThru
          Start-Sleep -Seconds 20
          if ($first.HasExited) { throw "the app quit by itself (exit code $($first.ExitCode))" }
          $second = Start-Process $exe -ArgumentList 'kurobayomi://library' -PassThru
          if (-not $second.WaitForExit(20000)) { throw "the second launch kept running: it did not hand over to the first" }
          if ($first.HasExited) { throw "the first app quit" }
          "the second launch handed over and quit; the first app still runs"

      - name: Uninstall it
        shell: pwsh
        if: always()
        timeout-minutes: 3
        run: |
          Get-Process kurobayomi, gdbus -ErrorAction SilentlyContinue | Stop-Process -Force
          $app = "$env:LOCALAPPDATA\Programs\Kurobayomi Nightly"
          if (-not (Test-Path "$app\unins000.exe")) { exit 0 }
          Start-Process "$app\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          # the uninstaller finishes from a copy of itself, so wait for the folder to go
          for ($i = 0; $i -lt 30 -and (Test-Path "$app\bin"); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path "$app\bin") { throw "the uninstaller left $app\bin" }

      - uses: actions/upload-artifact@v4
        with:
          name: nightly-files-windows
          path: installer/Kurobayomi-Nightly-Setup-x86_64.exe
          retention-days: 14

  # Both builds go out together, files first and notes last, so the notes never name a commit whose AppImage or
  # installer is not up yet: the self-updaters of both read the commit from the notes.
  publish:
    needs: [appimage, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SHA }}

      - uses: actions/download-artifact@v4
        with:
          pattern: nightly-files-*
          merge-multiple: true
          path: files

      - name: Update the nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Once main has a newer commit that changed a workflow file, this token may make the tag only on main's newest
          # commit, so tagging this one would fail, and only after the old tag was deleted, leaving the release a draft the
          # app cannot see. Skip then: a newer run updates the nightly. A newer commit without a workflow change (docs,
          # plans) starts no CI and so no nightly of its own; this run still publishes then.
          git fetch -q --depth=1 origin main
          if [ "$(git rev-parse FETCH_HEAD)" != "$SHA" ] && ! git diff --quiet "$SHA" FETCH_HEAD -- .github/workflows; then
            echo "main has moved past $SHA with a workflow change; a newer run updates the nightly"
            exit 0
          fi
          short="$(git rev-parse --short=8 HEAD)"
          files=(files/Kurobayomi-nightly-x86_64.AppImage files/Kurobayomi-nightly-x86_64.AppImage.zsync files/Kurobayomi-Nightly-Setup-x86_64.exe)
          # the tag moves to this commit; the release itself stays, so there is never a moment without one. It is deleted
          # and made again rather than moved: GitHub refuses to let this token move a tag across a commit that changed a
          # workflow file, but making a tag on main's newest commit is allowed. Deleting the tag turns the release into a
          # draft, which the app cannot see (it reads it as no update), so the edit below publishes it again
          git push origin :refs/tags/nightly || true
          git push origin "$SHA:refs/tags/nightly"
          if gh release view nightly >/dev/null 2>&1; then
            # files first, notes last: the app reads the commit from the notes, so it never sees a new commit with an old file
            gh release upload nightly "${files[@]}" --clobber
            gh release edit nightly --draft=false --prerelease --title "Nightly ($short)" --notes "Built from commit $SHA."
          else
            gh release create nightly "${files[@]}" --target "$SHA" --prerelease \
              --title "Nightly ($short)" --notes "Built from commit $SHA."
          fi
